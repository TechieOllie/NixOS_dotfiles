# Lock-file maintenance, not validation. `check.yml` is still the gate and
# still runs `nix flake check` and nothing else — this workflow's job is to
# keep `flake.lock` fresh enough that the gate doesn't fail for reasons that
# have nothing to do with the commit being pushed.
#
# The failure it exists to prevent: some inputs are rolling builds, and
# upstream replaces the tarball behind a given revision every few days.
# `zen-browser` is the one that has actually bitten — its `twilight` channel
# tracks Zen's nightly, so a lock left alone for a week eventually fails with
# a fixed-output hash mismatch on a push that never touched Zen. Bumping on a
# schedule means that breakage surfaces here, on its own run, instead of on
# the next unrelated commit.
#
# Pushing straight to main is deliberate: this is a solo repo with no PR
# flow, and the lock is only ever pushed after a full `nix flake check` has
# passed against it, so main cannot go red from this workflow.
name: update

on:
  schedule:
    # Daily, off the hour — GitHub's scheduler is heavily contended on the
    # hour and will silently delay or drop runs.
    - cron: "17 5 * * *"
  workflow_dispatch:

# A slow run must never overlap the next day's; the second would compute its
# lock against a tree the first is about to replace.
concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update-lock:
    runs-on: ubuntu-latest
    permissions:
      # To push the updated flake.lock back to main.
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            # Same substituters as check.yml, for the same reason — without
            # them the check below builds Noctalia and a kernel from source.
            extra-substituters = https://noctalia.cachix.org https://nyx-cache.chaotic.cx
            extra-trusted-public-keys = noctalia.cachix.org-1:pCOR47nnMEo5thcxNDtzWpOxNFQsBRglJzxWPp3dkU4= nyx-cache.chaotic.cx:dJxTrgMC3V3cFfyIiBQDQorG6k1LsqurH/srpMSq7qk=

      # Deliberately only the rolling input, not `nix flake update` wholesale.
      # Every other input is pinned by revision and narHash and cannot rot in
      # place; bumping them is a decision about which nixpkgs your machines
      # run, which stays yours (`just update`). Add input names here if
      # another one ever grows a fetch-from-a-mutable-URL derivation.
      - name: nix flake update zen-browser
        id: update
        run: |
          nix flake update zen-browser
          if git diff --quiet -- flake.lock; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "flake.lock is already current; nothing to check or push."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat -- flake.lock
          fi

      # Skipped when nothing moved: an unchanged lock evaluates to exactly
      # what the last push already gated, so re-running the full check would
      # burn a runner to re-derive a known-green result.
      - name: nix flake check
        if: steps.update.outputs.changed == 'true'
        run: nix flake check --print-build-logs

      # Only reached when the check above passed, so main stays green. A push
      # authenticated with GITHUB_TOKEN does not trigger workflows, so this
      # does not kick off a redundant check.yml run for a lock this job has
      # already checked.
      - name: Push the updated lock
        if: steps.update.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Bump flake inputs" -m "Automated by .github/workflows/update.yml; \`nix flake check\` passed against this lock." -- flake.lock
          git push
