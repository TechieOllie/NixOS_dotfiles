# Ported from home/niri/cfg/keybinds.kdl, bind for bind. niri's columns are
# Umbriel's scrolling-layout columns, so most actions map one to one; the
# few that don't are listed in home/umbriel/README.md. Every action is from
# Umbriel's docs/user/actions.md.
#
# AZERTY: Umbriel matches a bind against the key's *unshifted* symbol in the
# active layout (src/input/shortcut_keysym.cpp, level 0), and only borrows
# another layout's symbol when several are configured — this host has just
# `fr`. So the number row is named by what it types unshifted (ampersand,
# eacute, quotedbl, …), never 1-9, and `minus` is the 6 key. Binds named
# after a US layout would parse, validate and never fire.
#
# niri's hotkey-overlay-title strings have no equivalent: Umbriel's
# cheatsheet (cheatsheet-toggle) lists the binds themselves.

[keybinds]
# ── Noctalia ──────────────────────────────────────────────────────────────
"Mod+S" = { action = "spawn:noctalia msg panel-toggle control-center", repeat = false }
"Mod+Comma" = { action = "spawn:noctalia msg settings-toggle", repeat = false }
"Alt+Tab" = { action = "spawn:noctalia msg window-switcher", repeat = false }
"Mod+Space" = { action = "spawn:noctalia msg panel-toggle launcher", repeat = false }
"Mod+Alt+L" = { action = "spawn:noctalia msg session lock", repeat = false }
"Mod+Shift+Q" = { action = "spawn:noctalia msg panel-toggle session", repeat = false }
"Mod+P" = { action = "spawn:noctalia msg panel-toggle elijaharch/wl-screen-mirror:controls", repeat = false }
"Mod+V" = { action = "spawn:noctalia msg panel-toggle clipboard", repeat = false }

# ── Apps ──────────────────────────────────────────────────────────────────
"Mod+Return" = { action = "spawn:ghostty", repeat = false }
"Mod+Z" = { action = "spawn:zen-beta || zen-twilight || zen", repeat = false }
"Mod+B" = { action = "spawn:obsidian", repeat = false }
"Mod+E" = { action = "spawn:nautilus", repeat = false }
"Mod+Shift+S" = { action = "spawn:screenshot", repeat = false }

# ── Media and hardware keys ───────────────────────────────────────────────
# These repeat on purpose, so a held key keeps stepping.
"XF86AudioRaiseVolume" = { action = "spawn:noctalia msg volume-up", allow_when_locked = true }
"XF86AudioLowerVolume" = { action = "spawn:noctalia msg volume-down", allow_when_locked = true }
"XF86AudioMute" = { action = "spawn:noctalia msg volume-mute", allow_when_locked = true, repeat = false }
"XF86AudioMicMute" = { action = "spawn:noctalia msg mic-mute", allow_when_locked = true, repeat = false }
"XF86AudioNext" = { action = "spawn:noctalia msg media next", allow_when_locked = true, repeat = false }
"XF86AudioPrev" = { action = "spawn:noctalia msg media previous", allow_when_locked = true, repeat = false }
"XF86AudioPlay" = { action = "spawn:noctalia msg media toggle", allow_when_locked = true, repeat = false }
"XF86AudioPause" = { action = "spawn:noctalia msg media toggle", allow_when_locked = true, repeat = false }
"XF86MonBrightnessUp" = { action = "spawn:noctalia msg brightness-up", allow_when_locked = true }
"XF86MonBrightnessDown" = { action = "spawn:noctalia msg brightness-down", allow_when_locked = true }

# ── Windows and columns ───────────────────────────────────────────────────
"Mod+Q" = { action = "window-close", repeat = false }
"Mod+Left" = "window-focus-left"
"Mod+H" = "window-focus-left"
"Mod+Right" = "window-focus-right"
"Mod+L" = "window-focus-right"
"Mod+Ctrl+Left" = "column-move-left"
"Mod+Ctrl+H" = "column-move-left"
"Mod+Ctrl+Right" = "column-move-right"
"Mod+Ctrl+L" = "column-move-right"
"Mod+Home" = "column-focus-first"
"Mod+End" = "column-focus-last"
"Mod+Ctrl+Home" = "column-move-to-first"
"Mod+Ctrl+End" = "column-move-to-last"

"Mod+Ctrl+F" = { action = "window-toggle-maximize-to-edges", repeat = false }
"Mod+F" = { action = "window-toggle-maximize", repeat = false }
"Mod+Shift+F" = { action = "window-toggle-fullscreen", repeat = false }
"Mod+T" = { action = "window-toggle-floating", repeat = false }
"Mod+W" = { action = "column-toggle-tabbed", repeat = false }
"Mod+C" = "column-center"
# niri's set-column-width/set-window-height "±10%". In the scrolling
# layout the primary extent is the column's width and the secondary one
# the window's height within it. On the two keys left of Backspace, the
# AZERTY counterparts of US -/=: `minus` itself is the 6 key here, which
# is workspace 6.
"Mod+parenright" = "window-modify-primary-extent:-0.1"
"Mod+equal" = "window-modify-primary-extent:0.1"
"Mod+Shift+parenright" = "window-modify-secondary-extent:-0.1"
"Mod+Shift+equal" = "window-modify-secondary-extent:0.1"

# ── Outputs ───────────────────────────────────────────────────────────────
"Mod+Shift+Left" = "output-focus-left"
"Mod+Shift+Right" = "output-focus-right"
"Mod+Shift+Up" = "output-focus-up"
"Mod+Shift+Down" = "output-focus-down"
"Mod+Shift+H" = "output-focus-left"
"Mod+Shift+L" = "output-focus-right"
"Mod+Shift+J" = "output-focus-up"
"Mod+Shift+K" = "output-focus-down"
"Mod+Shift+Ctrl+Left" = "column-move-to-output-left"
"Mod+Shift+Ctrl+Right" = "column-move-to-output-right"
"Mod+Shift+Ctrl+Up" = "column-move-to-output-up"
"Mod+Shift+Ctrl+Down" = "column-move-to-output-down"
"Mod+Shift+Ctrl+H" = "column-move-to-output-left"
"Mod+Shift+Ctrl+L" = "column-move-to-output-right"
"Mod+Shift+Ctrl+J" = "column-move-to-output-up"
"Mod+Shift+Ctrl+K" = "column-move-to-output-down"
"Mod+Shift+P" = { action = "dpms-off", repeat = false }

# ── Workspaces ────────────────────────────────────────────────────────────
# Workspaces stack vertically per output (output.<name>.workspace_axis
# defaults to vertical), as in niri, so up/down are previous/next.
"Mod+WheelUp" = { action = "workspace-previous", cooldown_ms = 150 }
"Mod+Up" = { action = "workspace-previous", cooldown_ms = 150 }
"Mod+K" = { action = "workspace-previous", cooldown_ms = 150 }
"Mod+WheelDown" = { action = "workspace-next", cooldown_ms = 150 }
"Mod+Down" = { action = "workspace-next", cooldown_ms = 150 }
"Mod+J" = { action = "workspace-next", cooldown_ms = 150 }
"Mod+Ctrl+WheelUp" = { action = "column-move-to-workspace-previous", cooldown_ms = 150 }
"Mod+Ctrl+Up" = { action = "column-move-to-workspace-previous", cooldown_ms = 150 }
"Mod+Ctrl+K" = { action = "column-move-to-workspace-previous", cooldown_ms = 150 }
"Mod+Ctrl+WheelDown" = { action = "column-move-to-workspace-next", cooldown_ms = 150 }
"Mod+Ctrl+Down" = { action = "column-move-to-workspace-next", cooldown_ms = 150 }
"Mod+Ctrl+J" = { action = "column-move-to-workspace-next", cooldown_ms = 150 }

# The AZERTY number row, by its unshifted symbols (see the top of this file).
"Mod+ampersand" = "workspace-switch:1"
"Mod+eacute" = "workspace-switch:2"
"Mod+quotedbl" = "workspace-switch:3"
"Mod+apostrophe" = "workspace-switch:4"
"Mod+parenleft" = "workspace-switch:5"
"Mod+minus" = "workspace-switch:6"
"Mod+egrave" = "workspace-switch:7"
"Mod+underscore" = "workspace-switch:8"
"Mod+ccedilla" = "workspace-switch:9"
"Mod+Ctrl+ampersand" = "column-move-to-workspace:1"
"Mod+Ctrl+eacute" = "column-move-to-workspace:2"
"Mod+Ctrl+quotedbl" = "column-move-to-workspace:3"
"Mod+Ctrl+apostrophe" = "column-move-to-workspace:4"
"Mod+Ctrl+parenleft" = "column-move-to-workspace:5"
"Mod+Ctrl+minus" = "column-move-to-workspace:6"
"Mod+Ctrl+egrave" = "column-move-to-workspace:7"
"Mod+Ctrl+underscore" = "column-move-to-workspace:8"
"Mod+Ctrl+ccedilla" = "column-move-to-workspace:9"
"Mod+Tab" = { action = "workspace-focus-last", repeat = false }
"Mod+O" = { action = "overview-toggle", repeat = false }

# ── Scratchpads ───────────────────────────────────────────────────────────
# See cfg/scratchpad.toml. The first press launches the app if it isn't
# running yet; after that the key shows and hides it.
"Mod+Shift+Return" = { action = "scratchpad-toggle:terminal", repeat = false }
"Mod+M" = { action = "scratchpad-toggle:music", repeat = false }
# Mod+D was niri's "spawn vesktop"; here it summons the one already running.
"Mod+D" = { action = "scratchpad-toggle:discord", repeat = false }
"Mod+X" = { action = "scratchpad-toggle:bitwarden", repeat = false }

# ── Replay buffer ─────────────────────────────────────────────────────────
# home/gpu-screen-recorder.nix: the same two keys as on niri.
"Alt+Shift+F10" = { action = "spawn:replay toggle", repeat = false }
"Alt+F10" = { action = "spawn:replay save", repeat = false }

# ── Session ───────────────────────────────────────────────────────────────
"Mod+Escape" = { action = "shortcuts-inhibit-toggle", allow_when_inhibited = true, repeat = false }
# Confirms on screen first, like niri's quit.
"Ctrl+Alt+Delete" = { action = "session-quit", repeat = false }
