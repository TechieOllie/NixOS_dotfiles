# Scratchpads: windows kept off every workspace and summoned with one key
# (bound in cfg/keybinds.toml). Each is named, so Umbriel's implicit `default`
# scratchpad and its packaged Mod+Space/Mod+Tab binds don't exist here — those
# keys are the launcher and back-and-forth.
#
# spawn_when_empty makes the key work before the app is running: toggling an
# empty scratchpad runs the command, and the window_rule below catches the
# new window and shows it. Once a window is stored, the key only shows and
# hides it. Each window remembers where it would have opened, so
# window-restore-from-scratchpad (while it is shown) puts it back on a
# workspace.
#
# Scratchpad windows float, so each rule sizes them as a fraction of the
# output; they appear centred.

# A dropdown terminal, separate from the Mod+Return one. A distinct GTK
# class gives it its own app_id and its own Ghostty process — Ghostty treats
# any CLI argument as a reason not to join the existing single instance.
[[scratchpad]]
name = "terminal"
spawn_when_empty = "ghostty --class=com.mitchellh.ghostty.scratchpad"

[[window_rule]]
match.app_id = "^com\\.mitchellh\\.ghostty\\.scratchpad$"
default_scratchpad = "terminal"
default_floating_size = { width = 0.7, height = 0.6 }

[[scratchpad]]
name = "music"
spawn_when_empty = "feishin"

# Electron's Wayland app_id is the package.json name, "feishin".
[[window_rule]]
match.app_id = "^feishin$"
default_scratchpad = "music"
default_floating_size = { width = 0.6, height = 0.7 }

# Vesktop autostarts at login (home/vesktop.nix's user service), so this
# rule catches that first window and stores it hidden: Discord is running
# and notifying from the first minute, and Mod+D summons it. No
# default_focused, so login doesn't open with Discord in your face.
# spawn_when_empty only matters if Vesktop has been quit.
[[scratchpad]]
name = "discord"
spawn_when_empty = "vesktop"

[[window_rule]]
match.app_id = "^vesktop$"
default_scratchpad = "discord"
default_floating_size = { width = 0.8, height = 0.8 }
