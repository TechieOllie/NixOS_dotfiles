# Ported from home/niri/cfg/layout.kdl. Only the gap differs from Umbriel's
# defaults: the scrolling layout, center_focused = "never" and the
# 1/3-1/2-2/3 extent presets are all already what niri was set to, so they
# aren't restated.

[layout]
gap = 16

[workspaces]
# niri's workspace-auto-back-and-forth: pressing the current workspace's
# number again returns to the previous one.
back_and_forth = true

# theseus's built-in panel: 2880x1920 on 280 mm, about 260 DPI, so 1.0 is far
# too small. 1.6 divides the panel exactly (1800x1200 logical) and was picked
# on the real screen on 2026-10-19 over 1.5 and 2.0. By connector rather than
# monitor identity: it is the laptop's only internal port, and this panel
# reports no serial. An external monitor needs no table until it has been
# looked at; Umbriel enables it at its preferred mode.
[output.eDP-1]
scale = 1.6
# The panel advertises PQ over BT.2020 (`umbriel color`), so HDR is always
# on rather than "auto"; SDR content is mapped to sdr_white.
hdr = "on"
bit_depth = 10

# Docked: lid shut on an external monitor. logind leaves the machine running
# then (HandleLidSwitchDocked defaults to ignore, see hosts/theseus), so the
# panel is taken out of the layout rather than just blanked — its windows
# move to the external screen and come back when the lid opens. Undocked, the
# same lid_close fires on the way into suspend, which is harmless. Umbriel
# also runs the matching command once at startup, so signing in with the lid
# already shut works too. A temporary disable, not `enabled = false`: the
# table above still applies when the panel returns.
[events]
lid_close = "umbriel msg output-disable:eDP-1"
lid_open = "umbriel msg output-enable:eDP-1"
