# Ported from home/niri/cfg/rules.kdl. The window corner radius is not set
# here, for the same reason as there: it comes from style.toml (see
# config.toml), which Home Manager renders from home/noctalia.nix's `style`
# block, so it shares one number with Noctalia's bar.
#
# niri-only rules with nothing to port: `draw-border-with-background false`
# (niri paints a solid backing behind windows; Umbriel does not) and the
# noctalia-wallpaper `place-within-backdrop` layer-rule (Umbriel's overview
# shows the wallpaper itself, overview.workspace_wallpaper). Blur is off
# here as it is on niri — see misc.toml.

# Noctalia v5's own settings window, floating rather than tiled.
[[window_rule]]
match.app_id = "^dev\\.noctalia\\.Noctalia$"
default_floating = true
default_floating_size_px = { width = 1080, height = 920 }

# Umbriel's own screencast picker, floating as upstream's example config has
# it.
[[window_rule]]
match.app_id = "^dev\\.noctalia\\.UmbrielSharePicker$"
default_floating = true
default_floating_size_px = { width = 800, height = 600 }

# niri's open-maximized: a full-width column, gaps kept. See
# docs/decisions.md for why these three open that way.
[[window_rule]]
match.app_id = ["^zen(-\\w+)?$", "^md\\.obsidian\\.Obsidian$", "^steam$"]
default_maximize = true

# Vesktop has no rule here: it lives in the discord scratchpad
# (cfg/scratchpad.toml) instead of niri's maximized-on-the-second-monitor.

[[window_rule]]
match.app_id = "^steam$"
match.title = "^notificationtoasts_\\d+_desktop$"
default_position = { x = 10, y = 10, anchor = "bottom_right" }
default_focused = false

[[window_rule]]
match.app_id = "^zen(-\\w+)?$"
match.title = "^Picture-in-Picture$"
default_floating = true
default_floating_size_px = { width = 480, height = 270 }
default_position = { x = 32, y = 32, anchor = "bottom_right" }

# ── Games ─────────────────────────────────────────────────────────────────
# Two ways to recognise one. `steam_app_<id>` is the window class Proton
# gives every game, Heroic's included (umu passes them SteamAppId 0) — the
# same test home/gpu-screen-recorder.nix uses. content_type "game" catches
# anything that declares itself a game over the content-type protocol,
# whatever launched it; few X11 games do, so it is the second net, not the
# first.
#
# confine_pointer keeps the pointer inside the game while it has focus, for
# games that drop their pointer lock in menus — a touchpad swipe otherwise
# lands on the bar. vrr turns on adaptive sync for the game's output while
# it has focus; on a panel without it (outputs --json shows
# `adaptive_sync: null`) it does nothing. Tearing is left off: it needs an
# output-level opt-in and only earns it on an external high-refresh monitor.
[[window_rule]]
match.app_id = "^steam_app_[0-9]+$"
confine_pointer = true
vrr = "always"

[[window_rule]]
match.content_type = "game"
confine_pointer = true
vrr = "always"
